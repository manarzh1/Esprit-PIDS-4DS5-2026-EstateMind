services:
  - type: web
    name: immo-tunisia
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false   # à renseigner dans le dashboard Render
    rootDir: .
